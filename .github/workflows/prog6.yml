name: prog6
on:
  push:
    branches: [probe/mb6-271]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: ./.github/actions/setup-llvm
      - name: Install valgrind
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q valgrind
      - name: Profile
        run: |
          set -o pipefail; bash probe/prog-cg.sh 2>&1 | tee probe-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prog6
          path: |
            probe-out.txt
            /tmp/pg/summary.txt
            /tmp/pg/agg.txt
