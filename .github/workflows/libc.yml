name: libc
on:
  push:
    branches: [probe/libc-hot-271]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: hhh-pa/clojure-code-snippet
          path: snip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: ./.github/actions/setup-llvm
      - name: Probe
        run: set -o pipefail; bash probe/libc.sh 2>&1 | tee probe-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libc
          path: |
            probe-out.txt
            /tmp/libc/*.ld
            /tmp/libc/rss.txt
