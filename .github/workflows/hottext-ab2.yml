name: hot-text-ab2
on:
  push:
    branches: [probe/hot-text-ab2-271]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: hhh-pa/clojure-code-snippet
          path: snip
      - name: Install tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q time gdb valgrind
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: ./.github/actions/setup-llvm
      - name: RSS under four hot-text orders
        run: |
          set -o pipefail; bash probe/rss-ab.sh 2>&1 | tee probe-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-ab2
          path: |
            probe-out.txt
            probe/order-R2.ld
