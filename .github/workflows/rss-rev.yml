name: rss-rev
on:
  push:
    branches: [probe/rss-rev-271]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-llvm
      - name: Probe
        run: set -o pipefail; bash probe/rss-rev.sh 2>&1 | tee probe-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-rev
          path: |
            probe-out.txt
            /tmp/rss/rss.txt
            /tmp/rss/*.ld
