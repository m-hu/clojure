name: rss-hold
on:
  push:
    branches: [probe/rss-hold-271]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-llvm
      - name: Probe
        run: set -o pipefail; bash probe/rss-hold.sh 2>&1 | tee probe-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-hold
          path: |
            probe-out.txt
            /tmp/hold/rss.txt
            /tmp/hold/*.ld
