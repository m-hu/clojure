name: rss-probe
on:
  push:
    branches: [probe/rss-226]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q time valgrind
      - name: Probe
        run: |
          rustc -vV; uname -a; cat /proc/cpuinfo | grep 'model name' | head -1
          probe/run5.sh 2>&1 | tee probe-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-probe5
          path: |
            probe-out.txt
            /tmp/out/
