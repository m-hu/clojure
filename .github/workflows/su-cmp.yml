name: startup-cmp
on:
  push:
    branches: [probe/startup-cmp-271]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hhh-pa/clojure-code-snippet
          path: snip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: ./.github/actions/setup-llvm
      - name: Profile
        run: |
          set -o pipefail; bash probe/su-cmp.sh 2>&1 | tee probe-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-cmp
          path: |
            probe-out.txt
            /tmp/su/totals.txt
